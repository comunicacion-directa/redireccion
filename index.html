<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cargando...</title>

  <!-- Meta Pixel Code -->
  <script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '2192722984920622');
  fbq('track', 'PageView');
  </script>
  <noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id=2192722984920622&ev=PageView&noscript=1"
  /></noscript>
  <!-- End Meta Pixel Code -->

  <script>
    (function() {
      var eventID = 'contact_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
      var whatsappUrl = "https://wa.me/525522503978?text=Quiero%20m%C3%A1s%20informaci%C3%B3n%20sobre%20el%20servicio!!";
      var redirected = false;

      function triggerEventAndRedirect() {
        if (redirected) return;
        redirected = true;

        // Disparar el evento
        if (typeof fbq === 'function') {
          fbq('track', 'Contact', {
            value: 5.00,
            currency: 'MXN'
          }, { eventID: eventID });
        }

        // Pequeña pausa de red para asegurar que el paquete de Meta salga del navegador
        setTimeout(function() {
          window.location.replace(whatsappUrl);
        }, 100);
      }

      // Si el archivo del Pixel ya cargó, ejecuta inmediatamente
      if (window.fbq && window.fbq.loaded) {
        triggerEventAndRedirect();
      } else {
        // Si aún está descargando fbevents.js, espera al evento de carga del script
        var pixelScript = document.querySelector('script[src*="fbevents.js"]');
        if (pixelScript) {
          pixelScript.onload = triggerEventAndRedirect;
          pixelScript.onerror = triggerEventAndRedirect; // Si falla o hay adblock, redirige igual
        } else {
          triggerEventAndRedirect();
        }

        // Respaldo de seguridad (máximo 800ms) para que no se quede trabado en conexiones muy lentas
        setTimeout(triggerEventAndRedirect, 800);
      }
    })();
  </script>
</head>
<body style="background-color: #ffffff; margin:0; padding:0;"></body>
</html>
